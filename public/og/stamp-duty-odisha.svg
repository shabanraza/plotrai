<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .sans { font-family: 'Inter', 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Pure white background (matches landing in light mode) -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Teal accent bar at the top, no gradient -->
  <rect x="0" y="0" width="1200" height="8" fill="#0d9488"/>

  <!-- Top-left logo: icon mark scaled to 56px high -->
  <g transform="translate(80, 70) scale(0.875)">
    <!-- Icon mark (matches src/components/logo.tsx) -->
    <g stroke="#15265F" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="13" cy="14" r="2" fill="#15265F"/>
      <line x1="13" y1="14" x2="9" y2="48"/>
      <line x1="13" y1="14" x2="17" y2="44"/>
      <path d="M 18 38 L 36 18 L 54 38 L 54 52 L 18 52 Z"/>
      <rect x="29" y="30" width="6" height="6" stroke-width="1.6"/>
      <rect x="40" y="42" width="5" height="10" stroke-width="1.6"/>
      <line x1="6" y1="55" x2="58" y2="55" stroke-width="2"/>
    </g>
    <path d="M 54 44 Q 60 38 66 42 Q 62 50 54 44 Z" fill="#7CB342"/>
    <path d="M 56 50 Q 62 44 68 48 Q 64 55 56 50 Z" fill="#9CCC65"/>
  </g>
  <!-- Wordmark: Plotr (navy) + Ai (teal), Inter Black -->
  <line x1="160" y1="86" x2="160" y2="120" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="178" y="118" class="sans" font-weight="800" font-size="40" letter-spacing="-1.2" fill="#15265F">Plotr</text>
  <text x="288" y="118" class="sans" font-weight="800" font-size="40" letter-spacing="-1.2" fill="#0d9488">Ai</text>

  <!-- Top-right route kicker -->
  <text x="1120" y="113" class="mono" text-anchor="end" font-size="18" letter-spacing="2" fill="#71717a">STAMP DUTY · ODISHA</text>

  <!-- Title block, left-aligned -->
  <text x="80" y="320" class="sans" font-weight="800" font-size="68" letter-spacing="-2" fill="#18181b">Odisha Stamp Duty Calculator</text>
  <text x="80" y="400" class="sans" font-weight="800" font-size="68" letter-spacing="-2" fill="#18181b">2026</text>

  <!-- Subtitle -->
  <text x="80" y="504" class="sans" font-weight="400" font-size="24" fill="#3f3f46">Stamp duty + registration rates for Odisha, with male, female, and joint buyer…</text>

  <!-- Footer hairline -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Footer left: domain -->
  <text x="80" y="582" class="sans" font-weight="600" font-size="22" fill="#18181b">plotrai.in</text>
  <text x="80" y="608" class="mono" font-size="14" letter-spacing="1.5" fill="#71717a">/stamp-duty/odisha</text>

  <!-- Footer right: tagline pill -->
  <rect x="820" y="563" width="300" height="40" rx="20" fill="#ecfdf5" stroke="#14b8a6" stroke-width="1"/>
  <text x="970" y="589" class="sans" font-weight="600" font-size="16" text-anchor="middle" fill="#0d9488">Free for Indian homeowners</text>
</svg>